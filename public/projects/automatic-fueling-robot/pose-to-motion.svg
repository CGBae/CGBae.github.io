<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc">
<title id="title">인식한 목표점을 로봇 동작으로</title><desc id="desc">현재 코드에서 확인한 9단계 흐름. 영상과 카메라 내부 파라미터, ArUco ID 0의 pose와 모드 오프셋, detector 평균, camera-world 축 매핑, hole mouth 보정과 Z 고정, gate와 5 sample lock, tip waypoint, link_6 목표, RMPFlow 순서. lock timeout 뒤 USD reference로 진행하는 대체 분기와 사용하지 않는 marker orientation을 별도로 표시한다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#176b8f"/></marker><marker id="teal-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#087f73"/></marker></defs>
<style>text{font-family:"Malgun Gothic","Noto Sans KR","Apple SD Gothic Neo",sans-serif;fill:#172c3e}.mono{font-family:Consolas,"DejaVu Sans Mono",monospace}.muted{fill:#526475}.blue{fill:#176b8f}.teal{fill:#087f73}</style>
<rect x="0" y="0" width="1200" height="1080" rx="0" fill="#f4f7fa"/>
<text x="48" y="39" font-size="15" fill="#176b8f" style="fill:#176b8f" font-weight="700" text-anchor="start">CODE-DERIVED DIAGRAM  /  01</text>
<text x="48" y="85" font-size="34" fill="#172c3e" style="fill:#172c3e" font-weight="700" text-anchor="start">인식한 목표점을 로봇 동작으로</text>
<text x="48" y="122" font-size="18" fill="#526475" style="fill:#526475" font-weight="400" text-anchor="start">기본 실행 코드의 데이터 흐름 · 팀 구현 · 수치와 분기는 코드 설정 기준</text>
<text x="60" y="161" font-size="16" fill="#176b8f" style="fill:#176b8f" font-weight="700" text-anchor="start">01  PERCEPTION · camera target</text>
<text x="60" y="391" font-size="16" fill="#176b8f" style="fill:#176b8f" font-weight="700" text-anchor="start">02  TARGET LOCK · world target</text>
<text x="60" y="621" font-size="16" fill="#176b8f" style="fill:#176b8f" font-weight="700" text-anchor="start">03  MOTION · joint action</text>
<rect x="60" y="180" width="340" height="150" rx="14" fill="white" stroke="#d9e2e9"/>
<circle cx="89" cy="210" r="15" fill="#176b8f"/>
<text x="89" y="216" font-size="16" fill="white" style="fill:white" font-weight="700" text-anchor="middle">1</text>
<text x="116" y="217" font-size="22" fill="#172c3e" style="fill:#172c3e" font-weight="700" text-anchor="start">영상과 카메라 정보</text>
<text x="80" y="257" font-size="17" fill="#526475" style="fill:#526475" font-weight="400" text-anchor="start">/rgb + /camera_info</text>
<text x="80" y="284" font-size="17" fill="#526475" style="fill:#526475" font-weight="400" text-anchor="start">RGB · K / distortion</text>
<rect x="430" y="180" width="340" height="150" rx="14" fill="white" stroke="#d9e2e9"/>
<circle cx="459" cy="210" r="15" fill="#176b8f"/>
<text x="459" y="216" font-size="16" fill="white" style="fill:white" font-weight="700" text-anchor="middle">2</text>
<text x="486" y="217" font-size="22" fill="#172c3e" style="fill:#172c3e" font-weight="700" text-anchor="start">Marker → 작업 target</text>
<text x="450" y="257" font-size="17" fill="#526475" style="fill:#526475" font-weight="400" text-anchor="start">ArUco ID 0 → rvec / tvec</text>
<text x="450" y="284" font-size="17" fill="#526475" style="fill:#526475" font-weight="400" text-anchor="start">p = R · offset_mode + t</text>
<text x="450" y="311" font-size="17" fill="#526475" style="fill:#526475" font-weight="400" text-anchor="start">door / cap / hole</text>
<rect x="800" y="180" width="340" height="150" rx="14" fill="white" stroke="#d9e2e9"/>
<circle cx="829" cy="210" r="15" fill="#176b8f"/>
<text x="829" y="216" font-size="16" fill="white" style="fill:white" font-weight="700" text-anchor="middle">3</text>
<text x="856" y="217" font-size="22" fill="#172c3e" style="fill:#172c3e" font-weight="700" text-anchor="start">Detector 평균 · lock</text>
<text x="820" y="257" font-size="17" fill="#526475" style="fill:#526475" font-weight="400" text-anchor="start">최근 최대 8개 · 최소 3개</text>
<text x="820" y="284" font-size="17" fill="#526475" style="fill:#526475" font-weight="400" text-anchor="start">‖std‖ ≤ 0.035 m</text>
<text x="820" y="311" font-size="17" fill="#526475" style="fill:#526475" font-weight="400" text-anchor="start">최초 안정 window에서 lock</text>
<rect x="60" y="410" width="340" height="150" rx="14" fill="white" stroke="#d9e2e9"/>
<circle cx="89" cy="440" r="15" fill="#176b8f"/>
<text x="89" y="446" font-size="16" fill="white" style="fill:white" font-weight="700" text-anchor="middle">4</text>
<text x="116" y="447" font-size="22" fill="#172c3e" style="fill:#172c3e" font-weight="700" text-anchor="start">Camera → world</text>
<text x="80" y="487" font-size="17" fill="#526475" style="fill:#526475" font-weight="400" text-anchor="start">camera 원점 + (−x, −z, −y)</text>
<text x="80" y="514" font-size="17" fill="#526475" style="fill:#526475" font-weight="400" text-anchor="start">scene 배치에 맞춘 축 매핑</text>
<rect x="430" y="410" width="340" height="150" rx="14" fill="white" stroke="#d9e2e9"/>
<circle cx="459" cy="440" r="15" fill="#176b8f"/>
<text x="459" y="446" font-size="16" fill="white" style="fill:white" font-weight="700" text-anchor="middle">5</text>
<text x="486" y="447" font-size="22" fill="#172c3e" style="fill:#172c3e" font-weight="700" text-anchor="start">Mouth 보정 → Z 고정</text>
<text x="450" y="487" font-size="17" fill="#526475" style="fill:#526475" font-weight="400" text-anchor="start">hole만 −0.05 · n_outward</text>
<text x="450" y="514" font-size="17" fill="#526475" style="fill:#526475" font-weight="400" text-anchor="start">그다음 z = reference.z</text>
<rect x="800" y="410" width="340" height="150" rx="14" fill="white" stroke="#d9e2e9"/>
<circle cx="829" cy="440" r="15" fill="#176b8f"/>
<text x="829" y="446" font-size="16" fill="white" style="fill:white" font-weight="700" text-anchor="middle">6</text>
<text x="856" y="447" font-size="22" fill="#172c3e" style="fill:#172c3e" font-weight="700" text-anchor="start">Gate → 5 sample lock</text>
<text x="820" y="487" font-size="17" fill="#526475" style="fill:#526475" font-weight="400" text-anchor="start">half-extent: 0.35 / 0.35 / 0.18 m</text>
<text x="820" y="514" font-size="17" fill="#526475" style="fill:#526475" font-weight="400" text-anchor="start">‖std‖ ≤ 0.025 m</text>
<text x="820" y="541" font-size="17" fill="#526475" style="fill:#526475" font-weight="400" text-anchor="start">유효한 새 sample의 평균 확정</text>
<rect x="60" y="640" width="340" height="150" rx="14" fill="white" stroke="#d9e2e9"/>
<circle cx="89" cy="670" r="15" fill="#176b8f"/>
<text x="89" y="676" font-size="16" fill="white" style="fill:white" font-weight="700" text-anchor="middle">7</text>
<text x="116" y="677" font-size="22" fill="#172c3e" style="fill:#172c3e" font-weight="700" text-anchor="start">Tip waypoint 구성</text>
<text x="80" y="717" font-size="17" fill="#526475" style="fill:#526475" font-weight="400" text-anchor="start">확정 center + 고정 접근축</text>
<text x="80" y="744" font-size="17" fill="#526475" style="fill:#526475" font-weight="400" text-anchor="start">far → mid → near → insert</text>
<text x="80" y="771" font-size="17" fill="#526475" style="fill:#526475" font-weight="400" text-anchor="start">후퇴 → home</text>
<rect x="430" y="640" width="340" height="150" rx="14" fill="white" stroke="#d9e2e9"/>
<circle cx="459" cy="670" r="15" fill="#176b8f"/>
<text x="459" y="676" font-size="16" fill="white" style="fill:white" font-weight="700" text-anchor="middle">8</text>
<text x="486" y="677" font-size="22" fill="#172c3e" style="fill:#172c3e" font-weight="700" text-anchor="start">Tip → link_6 목표</text>
<text x="450" y="717" font-size="17" fill="#526475" style="fill:#526475" font-weight="400" text-anchor="start">+0.63 · n + (0, 0, −0.25) m</text>
<text x="450" y="744" font-size="17" fill="#526475" style="fill:#526475" font-weight="400" text-anchor="start">속도 제한 Cartesian 보간</text>
<text x="450" y="771" font-size="17" fill="#526475" style="fill:#526475" font-weight="400" text-anchor="start">orientation = reset EE 자세</text>
<rect x="800" y="640" width="340" height="150" rx="14" fill="white" stroke="#d9e2e9"/>
<circle cx="829" cy="670" r="15" fill="#176b8f"/>
<text x="829" y="676" font-size="16" fill="white" style="fill:white" font-weight="700" text-anchor="middle">9</text>
<text x="856" y="677" font-size="22" fill="#172c3e" style="fill:#172c3e" font-weight="700" text-anchor="start">RMPFlow → joint action</text>
<text x="820" y="717" font-size="17" fill="#526475" style="fill:#526475" font-weight="400" text-anchor="start">위치 + 고정 orientation 전달</text>
<text x="820" y="744" font-size="17" fill="#526475" style="fill:#526475" font-weight="400" text-anchor="start">ArticulationMotionPolicy</text>
<text x="820" y="771" font-size="17" fill="#526475" style="fill:#526475" font-weight="400" text-anchor="start">60 Hz physics step에서 실행</text>
<path d="M400 255 H425" fill="none" stroke="#176b8f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M770 255 H795" fill="none" stroke="#176b8f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M400 485 H425" fill="none" stroke="#176b8f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M770 485 H795" fill="none" stroke="#176b8f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M400 715 H425" fill="none" stroke="#176b8f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M770 715 H795" fill="none" stroke="#176b8f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1140 255 H1170 V350 H30 V485 H54" fill="none" stroke="#176b8f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1140 485 H1170 V580 H30 V715 H54" fill="none" stroke="#176b8f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="600" y="340" font-size="15" fill="#526475" style="fill:#526475" font-weight="400" text-anchor="middle">PoseStamped.position + target_locked</text>
<text x="600" y="570" font-size="15" fill="#526475" style="fill:#526475" font-weight="400" text-anchor="middle">확정된 world center로 sequence를 한 번 구성</text>
<rect x="48" y="835" width="1104" height="104" rx="14" fill="#eaf4f7" stroke="#d9e2e9"/>
<text x="70" y="866" font-size="17" fill="#176b8f" style="fill:#176b8f" font-weight="700" text-anchor="start">LOCK TIMEOUT → USD REFERENCE → 07 TIP WAYPOINT</text>
<text x="70" y="897" font-size="18" fill="#172c3e" style="fill:#172c3e" font-weight="400" text-anchor="start">약 10초 동안 lock되지 않으면 scene reference로 진행합니다. prim 부재 시 코드 상수를 사용합니다.</text>
<text x="70" y="923" font-size="17" fill="#526475" style="fill:#526475" font-weight="400" text-anchor="start">이 분기는 재시도·중단이 아니라 대체 목표점으로 진행하는 경로입니다.</text>
<text x="48" y="976" font-size="18" fill="#526475" style="fill:#526475" font-weight="400" text-anchor="start">Detector가 발행하는 marker quaternion / direction은 기본 main의 자세 제어에 사용하지 않습니다.</text>
<text x="48" y="1007" font-size="17" fill="#526475" style="fill:#526475" font-weight="400" text-anchor="start">설정값은 측정 정확도나 성공률이 아닙니다. 최종 시연의 모든 cycle이 lock 경로를 탔는지는 확인되지 않았습니다.</text>
<text x="48" y="1051" font-size="13" fill="#526475" style="fill:#526475" font-weight="400" text-anchor="start">SOURCE  aruco_marker_detector.py · aruco_detector_params_visual_test.yaml · multi_robot_oiling.py · RMPFlow controller</text>
</svg>
