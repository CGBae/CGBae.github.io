      .ink{fill:#162033}.muted{fill:#627087}.faint{fill:#8B97AA}.label{font-size:12px;font-weight:700;letter-spacing:1.6px}
      .title{font-size:31px;font-weight:750;letter-spacing:-.8px}.subtitle{font-size:15px}.card-title{font-size:16px;font-weight:720}
      .card-body{font-size:12.5px}.card-code{font-size:11.5px;font-weight:550}.step{font-size:11px;font-weight:750}
      .arrow-label{font-size:10px;font-weight:650}.formula{font-size:14px;font-weight:650}.note{font-size:12px;font-weight:520}
      .hairline{stroke:#D9E0EA;stroke-width:1.25}.connector{stroke:#9DA9BA;stroke-width:1.5;fill:none}
    </style>
