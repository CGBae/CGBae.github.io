<svg xmlns='http://www.w3.org/2000/svg' width='1440' height='760' viewBox='0 0 1440 760' role='img' aria-labelledby='title desc'>
  <title id='title'>ArUco pose에서 로봇 motion까지의 변환 흐름</title>
  <desc id='desc'>ArUco pose, mode offset, target lock, camera-to-world 변환, nozzle waypoint와 link_6 offset, RMPFlow 명령을 잇는 코드 기반 다이어그램.</desc>
