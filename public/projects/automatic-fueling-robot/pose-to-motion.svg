  <text x='76' y='592' class='mono formula' fill='#0D9488'>p<tspan baseline-shift='sub' font-size='10'>target</tspan><tspan baseline-shift='super' font-size='10'>C</tspan> = R<tspan baseline-shift='sub' font-size='10'>M→C</tspan> · o<tspan baseline-shift='sub' font-size='10'>mode</tspan><tspan baseline-shift='super' font-size='10'>M</tspan> + t<tspan baseline-shift='sub' font-size='10'>M</tspan><tspan baseline-shift='super' font-size='10'>C</tspan></text>
  <path d='M448 586h44' class='connector' marker-end='url(#arrow)'/>
  <text x='520' y='592' class='mono formula' fill='#5B5BD6'>p<tspan baseline-shift='sub' font-size='10'>target</tspan><tspan baseline-shift='super' font-size='10'>W</tspan> = t<tspan baseline-shift='sub' font-size='10'>camera</tspan><tspan baseline-shift='super' font-size='10'>W</tspan> + [−x<tspan baseline-shift='sub' font-size='10'>C</tspan>, −z<tspan baseline-shift='sub' font-size='10'>C</tspan>, −y<tspan baseline-shift='sub' font-size='10'>C</tspan>]</text>
  <path d='M996 586h44' class='connector' marker-end='url(#arrow)'/>
  <text x='1068' y='592' class='mono formula' fill='#248A63'>p<tspan baseline-shift='sub' font-size='10'>link6</tspan> = p<tspan baseline-shift='sub' font-size='10'>tip</tspan> + n<tspan baseline-shift='sub' font-size='10'>out</tspan>·0.63 + [0,0,−0.25]</text>
