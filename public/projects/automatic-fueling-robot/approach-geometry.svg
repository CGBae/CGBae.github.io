<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1154" viewBox="0 0 1200 1154" role="img" aria-labelledby="title desc">
<title id="title">주유구 기준점에서 노즐과 손목 목표로</title><desc id="desc">world YZ 평면의 접근 방향 n=[0,sin105도,-cos105도]. 105도는 -Z에서 +Y 방향으로 잰 각이다. 보정된 center를 기준으로 tip 목표를 far +0.28m, mid +0.18m, near +0.09m, insert -0.05m에 배치한다. link_6 목표는 tip 목표에 0.63n과 Z -0.25m를 더한다. 모든 수치는 코드 설정이며 측정 TCP 보정값이 아니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#176b8f"/></marker><marker id="teal-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#087f73"/></marker></defs>
<style>text{font-family:"Malgun Gothic","Noto Sans KR","Apple SD Gothic Neo",sans-serif;fill:#172c3e}.mono{font-family:Consolas,"DejaVu Sans Mono",monospace}.muted{fill:#526475}.blue{fill:#176b8f}.teal{fill:#087f73}</style>
<rect x="0" y="0" width="1200" height="1154" rx="0" fill="#f4f7fa"/>
<text x="48" y="39" font-size="15" fill="#176b8f" style="fill:#176b8f" font-weight="700" text-anchor="start">CODE-DERIVED DIAGRAM  /  03</text>
<text x="48" y="85" font-size="34" fill="#172c3e" style="fill:#172c3e" font-weight="700" text-anchor="start">주유구 기준점에서 노즐과 손목 목표로</text>
<text x="48" y="122" font-size="18" fill="#526475" style="fill:#526475" font-weight="400" text-anchor="start">build_fuel_port_sequence · 고정된 world YZ 접근축과 virtual nozzle offset</text>
<rect x="48" y="157" width="1104" height="484" rx="14" fill="white" stroke="#d9e2e9"/>
<text x="76" y="194" font-size="22" fill="#172c3e" style="fill:#172c3e" font-weight="700" text-anchor="start">01  World YZ 평면에서 tip 목표점을 배치합니다.</text>
<text x="76" y="227" font-size="21" fill="#176b8f" style="fill:#176b8f" font-weight="400" text-anchor="start" class="mono">n = [0, sin(105°), −cos(105°)] ≈ [0, 0.966, 0.259]</text>
<path d="M335 574 V279" fill="none" stroke="#176b8f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M198 470 H1063" fill="none" stroke="#176b8f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="351" y="289" font-size="17" fill="#176b8f" style="fill:#176b8f" font-weight="400" text-anchor="start" class="mono">+Z_world</text>
<text x="1049" y="498" font-size="17" fill="#176b8f" style="fill:#176b8f" font-weight="400" text-anchor="end" class="mono">+Y_world</text>
<text x="349" y="573" font-size="17" fill="#526475" style="fill:#526475" font-weight="400" text-anchor="start">−Z</text>
<path d="M211.36 503.13 L953.19 304.36" fill="none" stroke="#087f73" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)"/>
<text x="943.1925288250037" y="286.35581113438667" font-size="19" fill="#087f73" style="fill:#087f73" font-weight="400" text-anchor="end" class="mono">n_outward</text>
<path d="M335 545 A75 75 0 0 0 407.444 450.589" fill="none" stroke="#176b8f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="423" y="524" font-size="22" fill="#176b8f" style="fill:#176b8f" font-weight="700" text-anchor="start">105°</text>
<text x="480" y="555" font-size="17" fill="#526475" style="fill:#526475" font-weight="400" text-anchor="start">−Z에서 +Y 쪽으로 정의</text>
<circle cx="335" cy="470" r="7" fill="#172c3e"/>
<text x="327" y="437" font-size="18" fill="#172c3e" style="fill:#172c3e" font-weight="700" text-anchor="end" class="mono">center</text>
<circle cx="257.72593389687455" cy="490.70552360820164" r="8" fill="white" stroke="#087f73" stroke-width="2"/>
<path d="M257.73 500.71 V509" fill="none" stroke="#d9e2e9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="258" y="551" font-size="19" fill="#087f73" style="fill:#087f73" font-weight="700" text-anchor="middle" class="mono">insert</text>
<text x="258" y="577" font-size="18" fill="#172c3e" style="fill:#172c3e" font-weight="400" text-anchor="middle" class="mono">−0.05 m</text>
<circle cx="474.09331898562584" cy="432.730057505237" r="8" fill="white" stroke="#087f73" stroke-width="2"/>
<path d="M474.09 422.73 V399" fill="none" stroke="#d9e2e9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="474" y="367" font-size="19" fill="#087f73" style="fill:#087f73" font-weight="700" text-anchor="middle" class="mono">near</text>
<text x="474" y="393" font-size="18" fill="#172c3e" style="fill:#172c3e" font-weight="400" text-anchor="middle" class="mono">+0.09 m</text>
<circle cx="613.1866379712517" cy="395.460115010474" r="8" fill="white" stroke="#087f73" stroke-width="2"/>
<path d="M613.19 385.46 V359" fill="none" stroke="#d9e2e9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="613" y="327" font-size="19" fill="#087f73" style="fill:#087f73" font-weight="700" text-anchor="middle" class="mono">mid</text>
<text x="613" y="353" font-size="18" fill="#172c3e" style="fill:#172c3e" font-weight="400" text-anchor="middle" class="mono">+0.18 m</text>
<circle cx="767.7347701775027" cy="354.04906779407065" r="8" fill="white" stroke="#087f73" stroke-width="2"/>
<path d="M767.73 344.05 V314" fill="none" stroke="#d9e2e9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="768" y="282" font-size="19" fill="#087f73" style="fill:#087f73" font-weight="700" text-anchor="middle" class="mono">far</text>
<text x="768" y="308" font-size="18" fill="#172c3e" style="fill:#172c3e" font-weight="400" text-anchor="middle" class="mono">+0.28 m</text>
<text x="894" y="579" font-size="16" fill="#526475" style="fill:#526475" font-weight="400" text-anchor="start">접근 순서</text>
<text x="894" y="607" font-size="17" fill="#172c3e" style="fill:#172c3e" font-weight="400" text-anchor="start">far → mid → near → insert</text>
<text x="76" y="618" font-size="16" fill="#526475" style="fill:#526475" font-weight="400" text-anchor="start">center = lock / fallback으로 확정한 보정 후 기준점</text>
<rect x="48" y="669" width="1104" height="213" rx="14" fill="white" stroke="#d9e2e9"/>
<text x="76" y="706" font-size="22" fill="#172c3e" style="fill:#172c3e" font-weight="700" text-anchor="start">02  Tip 목표를 link_6 제어 목표로 바꿉니다.</text>
<rect x="76" y="729" width="1048" height="68" rx="10" fill="#eaf4f7"/>
<text x="600" y="771" font-size="24" fill="#176b8f" style="fill:#176b8f" font-weight="400" text-anchor="middle" class="mono">link6_goal = tip_goal + 0.63 · n + [0, 0, −0.25]   (m)</text>
<text x="76" y="834" font-size="19" fill="#172c3e" style="fill:#172c3e" font-weight="700" text-anchor="start">0.63 m: virtual nozzle 길이</text>
<text x="580" y="834" font-size="19" fill="#172c3e" style="fill:#172c3e" font-weight="700" text-anchor="start">−0.25 m: world Z 추가 보정</text>
<text x="76" y="862" font-size="18" fill="#526475" style="fill:#526475" font-weight="400" text-anchor="start">물리 TCP를 측정한 calibration 값이 아닌 현재 코드의 tuning 값입니다.</text>
<rect x="48" y="910" width="1104" height="166" rx="14" fill="white" stroke="#d9e2e9"/>
<text x="76" y="947" font-size="22" fill="#172c3e" style="fill:#172c3e" font-weight="700" text-anchor="start">03  접근·삽입 구간에서 reset EE orientation을 유지합니다.</text>
<text x="76" y="986" font-size="19" fill="#172c3e" style="fill:#172c3e" font-weight="400" text-anchor="start">위치 목표: 위 offset을 적용한 link_6 위치   /   자세 목표: reset 때 복사한 EE quaternion</text>
<text x="76" y="1023" font-size="18" fill="#526475" style="fill:#526475" font-weight="400" text-anchor="start">105°는 joint angle이나 marker에서 실시간 추정한 각도가 아닙니다.</text>
<text x="76" y="1054" font-size="18" fill="#526475" style="fill:#526475" font-weight="400" text-anchor="start">−0.05 m는 목표점 배치값입니다. 실제 접촉 삽입 깊이·정확도를 측정한 수치가 아닙니다.</text>
<text x="48" y="1124" font-size="13" fill="#526475" style="fill:#526475" font-weight="400" text-anchor="start">SOURCE  multi_robot_oiling.py · NOZZLE_OUTWARD_WORLD · VIRTUAL_NOZZLE_LENGTH / Z_OFFSET · build_fuel_port_sequence · RobotARunner.reset</text>
</svg>
