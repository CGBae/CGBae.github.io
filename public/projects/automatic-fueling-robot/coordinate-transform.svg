<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img" aria-labelledby="title desc">
<title id="title">Camera target을 world target으로</title><desc id="desc">카메라 좌표 (x,y,z)를 (-x,-z,-y)로 매핑하여 world camera origin에 더한다. hole mode에서는 0.05 m 안쪽 보정을 먼저 하고 Z를 reference 높이로 고정한다. 그다음 gate 검사와 5 sample 표준편차 검사로 center를 확정한다. Z 고정 때문에 원래 camera 높이의 분산을 검증하지 않는다는 제한이 있다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#176b8f"/></marker><marker id="teal-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#087f73"/></marker></defs>
<style>text{font-family:"Malgun Gothic","Noto Sans KR","Apple SD Gothic Neo",sans-serif;fill:#172c3e}.mono{font-family:Consolas,"DejaVu Sans Mono",monospace}.muted{fill:#526475}.blue{fill:#176b8f}.teal{fill:#087f73}</style>
<rect x="0" y="0" width="1200" height="1050" rx="0" fill="#f4f7fa"/>
<text x="48" y="39" font-size="15" fill="#176b8f" style="fill:#176b8f" font-weight="700" text-anchor="start">CODE-DERIVED DIAGRAM  /  02</text>
<text x="48" y="85" font-size="34" fill="#172c3e" style="fill:#172c3e" font-weight="700" text-anchor="start">Camera target을 world target으로</text>
<text x="48" y="122" font-size="18" fill="#526475" style="fill:#526475" font-weight="400" text-anchor="start">transform_camera_point_to_world → StableTargetLockAcquirer · 처리 순서를 보존한 도해</text>
<rect x="48" y="157" width="1104" height="261" rx="14" fill="white" stroke="#d9e2e9"/>
<text x="76" y="192" font-size="22" fill="#172c3e" style="fill:#172c3e" font-weight="700" text-anchor="start">01  축을 매핑하고 camera의 world 원점을 더합니다.</text>
<rect x="76" y="215" width="1048" height="69" rx="10" fill="#eaf4f7"/>
<text x="600" y="258" font-size="23" fill="#176b8f" style="fill:#176b8f" font-weight="400" text-anchor="middle" class="mono">p_world_raw = camera_origin_world + [−x_cam, −z_cam, −y_cam]</text>
<text x="87" y="324" font-size="20" fill="#172c3e" style="fill:#172c3e" font-weight="400" text-anchor="start" class="mono">+x_camera</text>
<path d="M215 317 H272" fill="none" stroke="#176b8f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="289" y="324" font-size="20" fill="#176b8f" style="fill:#176b8f" font-weight="400" text-anchor="start" class="mono">−X_world</text>
<text x="436" y="324" font-size="20" fill="#172c3e" style="fill:#172c3e" font-weight="400" text-anchor="start" class="mono">+y_camera</text>
<path d="M564 317 H621" fill="none" stroke="#176b8f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="638" y="324" font-size="20" fill="#176b8f" style="fill:#176b8f" font-weight="400" text-anchor="start" class="mono">−Z_world</text>
<text x="785" y="324" font-size="20" fill="#172c3e" style="fill:#172c3e" font-weight="400" text-anchor="start" class="mono">+z_camera</text>
<path d="M913 317 H970" fill="none" stroke="#176b8f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="987" y="324" font-size="20" fill="#176b8f" style="fill:#176b8f" font-weight="400" text-anchor="start" class="mono">−Y_world</text>
<text x="76" y="369" font-size="18" fill="#526475" style="fill:#526475" font-weight="400" text-anchor="start">camera transform에서 translation을 사용합니다. 회전행렬 전체를 곱하는 일반 extrinsic 변환은 아닙니다.</text>
<text x="76" y="399" font-size="17" fill="#526475" style="fill:#526475" font-weight="400" text-anchor="start">도해의 X / Y / Z는 world 좌표축입니다. 축 방향과 부호는 현재 scene 배치에 의존합니다.</text>
<path d="M600 419 V443 H316 V457" fill="none" stroke="#176b8f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="48" y="464" width="536" height="174" rx="14" fill="white" stroke="#d9e2e9"/>
<rect x="616" y="464" width="536" height="174" rx="14" fill="white" stroke="#d9e2e9"/>
<text x="74" y="499" font-size="22" fill="#172c3e" style="fill:#172c3e" font-weight="700" text-anchor="start">02  Hole mouth → 내부 기준점</text>
<text x="74" y="539" font-size="20" fill="#176b8f" style="fill:#176b8f" font-weight="400" text-anchor="start" class="mono">p_candidate = p_world_raw − 0.05 · n</text>
<text x="74" y="579" font-size="18" fill="#172c3e" style="fill:#172c3e" font-weight="400" text-anchor="start">hole mode에만 적용 · n = n_outward</text>
<text x="74" y="611" font-size="17" fill="#526475" style="fill:#526475" font-weight="400" text-anchor="start">door / cap은 이 보정을 건너뜁니다.</text>
<text x="642" y="499" font-size="22" fill="#172c3e" style="fill:#172c3e" font-weight="700" text-anchor="start">03  Z를 reference 높이로 고정</text>
<text x="642" y="539" font-size="20" fill="#176b8f" style="fill:#176b8f" font-weight="400" text-anchor="start" class="mono">p_candidate.z = reference_center.z</text>
<text x="642" y="579" font-size="18" fill="#172c3e" style="fill:#172c3e" font-weight="400" text-anchor="start">기본 lock_z_to_reference = True</text>
<text x="642" y="611" font-size="17" fill="#526475" style="fill:#526475" font-weight="400" text-anchor="start">보정한 점의 Z를 다시 덮어씁니다.</text>
<path d="M585 551 H609" fill="none" stroke="#176b8f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M884 640 V665 H316 V690" fill="none" stroke="#176b8f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="48" y="706" width="1104" height="168" rx="14" fill="white" stroke="#d9e2e9"/>
<text x="76" y="744" font-size="23" fill="#172c3e" style="fill:#172c3e" font-weight="700" text-anchor="start">04  Gate 검사 → 최근 5개 유효 sample → 평균 / std → lock</text>
<text x="76" y="787" font-size="20" fill="#176b8f" style="fill:#176b8f" font-weight="400" text-anchor="start" class="mono">Gate half-extent  [0.35, 0.35, 0.18] m</text>
<text x="647" y="787" font-size="21" fill="#087f73" style="fill:#087f73" font-weight="400" text-anchor="start" class="mono">‖std_world‖ ≤ 0.025 m</text>
<text x="76" y="830" font-size="18" fill="#526475" style="fill:#526475" font-weight="400" text-anchor="start">gate를 벗어나면 sample buffer를 비웁니다. 새 pose message만 추가하고 조건을 만족하면 평균을 반환합니다.</text>
<rect x="48" y="906" width="1104" height="77" rx="12" fill="#eaf4f7"/>
<text x="70" y="937" font-size="21" fill="#176b8f" style="fill:#176b8f" font-weight="700" text-anchor="start">Z 고정은 gate / std 검사보다 먼저입니다.</text>
<text x="70" y="967" font-size="18" fill="#172c3e" style="fill:#172c3e" font-weight="400" text-anchor="start">따라서 Z gate와 Z 분산은 원래 camera 높이 오차를 검증하지 않습니다.</text>
<text x="48" y="1021" font-size="13" fill="#526475" style="fill:#526475" font-weight="400" text-anchor="start">SOURCE  multi_robot_oiling.py · transform_camera_point_to_world · detected_world_point_to_mouth_center · StableTargetLockAcquirer</text>
</svg>
