<path d="M438.000 301.000 L440.258 301.037 L442.513 301.148 L444.763 301.332 L447.006 301.590 L449.240 301.922 L451.461 302.326 L453.668 302.802 L455.859 303.351 L458.030 303.971 L460.179 304.662 L462.305 305.422 L464.405 306.252 L466.477 307.150 L468.518 308.116 L470.526 309.147 L472.500 310.244 L474.437 311.405 L476.334 312.629 L478.191 313.914 L480.005 315.259 L481.773 316.662 L483.495 318.123 L485.168 319.639 L486.790 321.210 L488.361 322.832 L489.877 324.505 L491.338 326.227 L492.741 327.995 L494.086 329.809 L495.371 331.666 L496.595 333.563 L497.756 335.500 L498.853 337.474 L499.884 339.482 L500.850 341.523 L501.748 343.595 L502.578 345.695 L503.338 347.821 L504.029 349.970 L504.649 352.141" fill="none" stroke="#bc3f24" stroke-width="2" marker-end="url(#237357)"/>
