<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">출구의 반대편에 두 주행 목표를 만듭니다</title><desc id="desc">map 평면의 A=(0,0), G=(0,-2) 예시. 후방 축에서 ±75도, 반경 0.5미터인 Q+와 Q−에 주행 목표를 생성하고 A를 바라보는 yaw를 부여한다. 채워진 원은 현재 로봇, 빈 원은 목표, 점선은 배정 관계이다.</desc>
