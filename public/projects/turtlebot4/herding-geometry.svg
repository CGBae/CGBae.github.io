<text x="466" y="487" font-size="21" fill="#bc3f24" font-weight="700" text-anchor="start">A · 모형 목표</text>
<rect x="423" y="776" width="30" height="30" rx="0" fill="#bc3f24" stroke="#bc3f24"/>
<text x="491" y="817" font-size="23" fill="#bc3f24" font-weight="700" text-anchor="start">G · 출구</text>
<circle cx="94" cy="838" r="7" fill="#121820" stroke="none" stroke-width="2"/>
<text x="111" y="844" font-size="16" fill="#606872" font-weight="400" text-anchor="start">현재 로봇</text>
<circle cx="277" cy="838" r="7" fill="white" stroke="#121820" stroke-width="2"/>
<text x="294" y="844" font-size="16" fill="#606872" font-weight="400" text-anchor="start">주행 목표</text>
<path d="M457,838 L499,838" fill="none" stroke="#606872" stroke-width="2" stroke-dasharray="5 5"/>
<text x="513" y="844" font-size="16" fill="#606872" font-weight="400" text-anchor="start">배정 관계 · 주행 궤적 아님</text>
<text x="892" y="201" font-size="17" fill="#bc3f24" font-weight="700" text-anchor="start">01</text>
<text x="944" y="203" font-size="26" fill="#121820" font-weight="700" text-anchor="start">두 후보점을 계산</text>
<text x="944" y="242" font-size="20" fill="#606872" font-weight="400" text-anchor="start">후방 단위벡터를 좌우 75° 회전</text>
<text x="944" y="276" font-size="20" fill="#606872" font-weight="400" text-anchor="start">반경 0.5 m에 Q+ / Q− 생성</text>
<path d="M892,319 L1392,319" fill="none" stroke="#d9dde2" stroke-width="1"/>
<text x="892" y="363" font-size="17" fill="#bc3f24" font-weight="700" text-anchor="start">02</text>
<text x="944" y="365" font-size="26" fill="#121820" font-weight="700" text-anchor="start">각도 비용으로 좌우 배정</text>
<text x="944" y="404" font-size="20" fill="#606872" font-weight="400" text-anchor="start">현재 방위각과 후보 방위각 비교</text>
<text x="944" y="438" font-size="20" fill="#606872" font-weight="400" text-anchor="start">교체 조건: 새 비용 + 20° &lt; 기존 비용</text>
<path d="M892,481 L1392,481" fill="none" stroke="#d9dde2" stroke-width="1"/>
<text x="892" y="525" font-size="17" fill="#bc3f24" font-weight="700" text-anchor="start">03</text>
<text x="944" y="527" font-size="26" fill="#121820" font-weight="700" text-anchor="start">목표의 이동량에 따라 갱신</text>
<text x="944" y="566" font-size="20" fill="#606872" font-weight="400" text-anchor="start">마지막 Goal 생성 위치에서 0.4 m 초과</text>
<text x="944" y="600" font-size="20" fill="#606872" font-weight="400" text-anchor="start">0.5초마다 판단 · 2 Hz</text>
<path d="M892,643 L1392,643" fill="none" stroke="#d9dde2" stroke-width="1"/>
<text x="892" y="687" font-size="17" fill="#bc3f24" font-weight="700" text-anchor="start">04</text>
<text x="944" y="689" font-size="26" fill="#121820" font-weight="700" text-anchor="start">경계와 목표 방향 적용</text>
<text x="944" y="728" font-size="20" fill="#606872" font-weight="400" text-anchor="start">fence 안쪽 0.3 m로 좌표 제한</text>
<text x="944" y="762" font-size="20" fill="#606872" font-weight="400" text-anchor="start">최종 목표점에서 A를 향하는 yaw</text>
<rect x="48" y="893" width="1344" height="114" rx="0" fill="#f3f5f7" stroke="#f3f5f7"/>
<text x="72" y="928" font-size="27" fill="#121820" font-weight="600" text-anchor="start">Q_s = clamp( A + 0.5 · R(s · 75°) · (A − G) / norm(A − G) )</text>
<text x="72" y="960" font-size="19" fill="#606872" font-weight="400" text-anchor="start">예시  A=(0, 0), G=(0, −2) → Q+=(−0.482963, 0.129410), Q−=(0.482963, 0.129410)</text>
<text x="72" y="990" font-size="18" fill="#606872" font-weight="400" text-anchor="start">코드: designator.py · 기하 계산과 배정 설명용. 실제 동물 반응·무충돌 성능은 별도 검증 대상입니다.</text>
</g></svg>