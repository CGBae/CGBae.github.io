<path d="M352.99852728656197,347.2239240309782 L388.7377828592575,356.8002286997714" fill="none" stroke="#121820" stroke-width="3" marker-end="url(#356b9a)"/>
<text x="336.5777882396478" y="403.82400026423534" font-size="25" fill="#121820" font-weight="700" text-anchor="middle">Q+</text>
<circle cx="539.4222117603522" cy="342.82400026423534" r="12" fill="white" stroke="#bc3f24" stroke-width="3"/>
<path d="M523.001472713438,347.2239240309782 L487.2622171407425,356.8002286997714" fill="none" stroke="#bc3f24" stroke-width="3" marker-end="url(#237357)"/>
<text x="539.4222117603522" y="403.82400026423534" font-size="25" fill="#bc3f24" font-weight="700" text-anchor="middle">Q−</text>
<text x="229" y="440" font-size="20" fill="#121820" font-weight="700" text-anchor="start">r = 0.5 m</text>
<text x="510" y="442" font-size="20" fill="#bc3f24" font-weight="700" text-anchor="start">yaw → A</text>
<path d="M438 355L453 370L438 385L423 370Z" fill="#f3f5f7" stroke="#bc3f24" stroke-width="2"/>
