<path d="M1169 406 L1190 406" stroke="#bc3f24" stroke-width="2.5" fill="none" marker-end="url(#arrow)" stroke-linejoin="round"/>
<rect x="56" y="640" width="714" height="200" rx="0" fill="#f3f5f7" stroke="#d9dde2" stroke-width="2"/>
<text x="80" y="680" font-size="25" fill="#121820" font-weight="700" text-anchor="start">한 요청에 선택한 대표 프레임 3장</text>
<rect x="80" y="708" width="102" height="70" rx="0" fill="#f3f5f7" stroke="#d9dde2" stroke-width="2"/>
<text x="131" y="752" font-size="24" fill="#bc3f24" font-weight="700" text-anchor="middle">F1</text>
<rect x="206" y="708" width="102" height="70" rx="0" fill="#f3f5f7" stroke="#d9dde2" stroke-width="2"/>
<text x="257" y="752" font-size="24" fill="#bc3f24" font-weight="700" text-anchor="middle">F2</text>
<rect x="332" y="708" width="102" height="70" rx="0" fill="#f3f5f7" stroke="#d9dde2" stroke-width="2"/>
<text x="383" y="752" font-size="24" fill="#bc3f24" font-weight="700" text-anchor="middle">F3</text>
<text x="480" y="736" font-size="22" fill="#606872" font-weight="400" text-anchor="start">이미지 3장과</text>
<text x="480" y="770" font-size="22" fill="#606872" font-weight="400" text-anchor="start">판정 2회는 별도 조건</text>
<path d="M600 636 L600 544" stroke="#bc3f24" stroke-width="2.5" fill="none" marker-end="url(#arrow)" stroke-linejoin="round"/>
<rect x="806" y="640" width="360" height="200" rx="0" fill="#f3f5f7" stroke="#d9dde2" stroke-width="2"/>
<text x="830" y="686" font-size="28" fill="#121820" font-weight="700" text-anchor="start">보류 / 추가 확인</text>
<text x="830" y="730" font-size="21" fill="#606872" font-weight="400" text-anchor="start">오류·가림·unknown 존재</text>
<text x="830" y="764" font-size="21" fill="#606872" font-weight="400" text-anchor="start">진도를 확정하지 않음</text>
<rect x="1202" y="640" width="342" height="200" rx="0" fill="#f3f5f7" stroke="#d9dde2" stroke-width="2"/>
<text x="1226" y="686" font-size="28" fill="#121820" font-weight="700" text-anchor="start">작업 상태 반영</text>
<text x="1226" y="730" font-size="21" fill="#606872" font-weight="400" text-anchor="start">허용된 완료 요청에서 갱신</text>
<text x="1226" y="764" font-size="21" fill="#606872" font-weight="400" text-anchor="start">검증 출처를 따로 기록</text>
<path d="M986 535 L986 626" stroke="#bc3f24" stroke-width="2.5" fill="none" marker-end="url(#arrow)" stroke-linejoin="round"/>
<path d="M1373 535 L1373 626" stroke="#bc3f24" stroke-width="2.5" fill="none" marker-end="url(#arrow)" stroke-linejoin="round"/>
<path d="M56 937 L1544 937" stroke="#d9dde2" stroke-width="2" fill="none"/>
<text x="56" y="981" font-size="20" fill="#606872" font-weight="400" text-anchor="start">confidence는 정확도 점수가 아니다. 두 판정에 서로 다른 새 프레임이 쓰였다는 보장도 별도 필요하다.</text>
<text x="56" y="1016" font-size="18" fill="#606872" font-weight="400" text-anchor="start">근거: multimodal_assessor.py / assessment_validator.py / engine.py / state_tracker.py</text>
